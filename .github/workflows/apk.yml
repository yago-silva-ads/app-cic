name: Testes e APK

# A cada push no branch de release (ou manualmente): analisa, testa e gera o APK Android.
# O APK fica em Releases > "apk-teste" (link fixo de download) e nos artefatos da execução.
# Sem a chave de assinatura (key.properties) o build usa a chave de testes do Android:
# serve para instalar e testar; para a Play Store, use a chave oficial (ver tool/build_mobile.sh).
on:
  push:
    branches: [release-blindada]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependências
        run: flutter pub get

      - name: Análise estática
        run: flutter analyze --no-fatal-infos

      - name: Testes do domínio (cálculos, previsão e trava da IA)
        working-directory: packages/cic_domain
        run: dart pub get && dart test

      - name: Testes do app
        run: |
          if [ -d test ]; then flutter test; else echo "sem testes do app"; fi

      - name: APK release ofuscado
        run: flutter build apk --release --obfuscate --split-debug-info=build/simbolos

      - name: Renomeia o APK
        run: cp build/app/outputs/flutter-apk/app-release.apk app-cic.apk

      - uses: actions/upload-artifact@v4
        with:
          name: app-cic-apk
          path: |
            app-cic.apk
            build/simbolos
          retention-days: 30

      - name: Publica em Releases (apk-teste)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-teste
          name: "APP-CIC — APK de teste (${{ github.ref_name }})"
          prerelease: true
          make_latest: false
          body: |
            APK gerado automaticamente do branch `${{ github.ref_name }}` (commit ${{ github.sha }}).
            Para instalar: baixe `app-cic.apk` no celular Android e permita "instalar apps desconhecidos".
            Assinado com a chave de testes (não use para publicar na Play Store).
          files: app-cic.apk
