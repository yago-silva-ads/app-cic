<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <meta name="description" content="APP-CIC: frente de caixa, controle de estoque e inteligência para a sua loja.">
  <meta name="theme-color" content="#0D0D0D">

  <!-- iOS (Adicionar à Tela de Início) -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="APP-CIC">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>APP-CIC</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #0D0D0D; }
    #carregando {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      background: #0D0D0D; color: #D4A843; font-family: -apple-system, system-ui, sans-serif;
      font-weight: 700; letter-spacing: 1px;
    }
    #carregando i {
      width: 34px; height: 34px; border-radius: 50%;
      border: 3px solid #2a2a2a; border-top-color: #D4A843;
      animation: gira 0.9s linear infinite;
    }
    @keyframes gira { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="carregando"><i></i><span>APP-CIC</span></div>
  <script>
    // Some o splash quando o Flutter desenhar o primeiro quadro.
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('carregando');
      if (el) el.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
  <!-- ZXing: leitura de código de barras (EAN/UPC/Code128/QR) pela câmera na versão Web/iPhone -->
  <script src="https://unpkg.com/@zxing/library@0.19.1" type="application/javascript"></script>
</body>
</html>
